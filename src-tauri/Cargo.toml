[package]
name = "cytracer"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "CyTracer - Cyrene's Video Motion Analyzer"
repository = "https://github.com/Cyrene2008/CyTracer"
homepage = "https://github.com/Cyrene2008/CyTracer"

[lib]
name = "cytracer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools", "protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde.workspace = true
serde_json.workspace = true
cytracer-core.workspace = true
cytracer-analyze.workspace = true
cytracer-project.workspace = true
