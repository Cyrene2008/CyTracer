[workspace]
resolver = "2"
members = [
    "crates/cytracer-core",
    "crates/cytracer-analyze",
    "crates/cytracer-project",
    "crates/cytracer-cli",
    "src-tauri",
]

[workspace.package]
edition = "2021"
version = "26.0.0"
license = "GPL-3.0-or-later"

[workspace.dependencies]
cytracer-core = { path = "crates/cytracer-core" }
cytracer-analyze = { path = "crates/cytracer-analyze" }
cytracer-project = { path = "crates/cytracer-project" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }

[profile.release]
opt-level = 2
strip = true
lto = "thin"
